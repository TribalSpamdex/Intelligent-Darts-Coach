name: IDC verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p ci-evidence
          node --test tests/*.test.mjs 2>&1 | tee ci-evidence/node.log
      - run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          status=0
          echo '::group::Chromium browser verification'
          python tests/browser.py 2>&1 | tee ci-evidence/chromium.log || status=1
          echo '::endgroup::'
          echo '::group::WebKit browser verification'
          IDC_BROWSER=webkit python tests/browser.py 2>&1 | tee ci-evidence/webkit.log || status=1
          echo '::endgroup::'
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev52-verification
          path: ci-evidence/
